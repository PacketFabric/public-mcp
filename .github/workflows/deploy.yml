# Build and deploy the hosted server.
#
# Follows the necron99/c3 pattern: build on the pf-arc-linux runners (which hold GCP
# credentials via Workload Identity, so no auth step and no service account key), push to
# gcr.io/packetfabric, then bump the image tag in pf_helm and let Flux apply it.
#
# Two copies of the same image with different settings:
#  - staging, https://mcp.dev.packetfabric.net (dev cluster, dev API): every push to dev
#    builds gcr.io/packetfabric/public-mcp:dev-<run_number> and deploys it.
#  - production, https://mcp.packetfabric.com: a release tag vX.Y.Z (the same tag
#    publish.yml ships to PyPI) builds gcr.io/packetfabric/public-mcp:vX.Y.Z and deploys it.
#    Release tags must be on main, i.e. pushed after the dev -> main PR; a release tag
#    anywhere else fails. Pre-release tags such as v0.3.0rc1 do not match the tag filter
#    and never deploy.
#
# A tag already in the registry is not rebuilt. Run it by hand (Actions > deploy > Run
# workflow) with a release tag to build one that predates this workflow or to redeploy it
# to production; untick "deploy" to only build the image.
name: deploy

on:
  push:
    branches: [dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and deploy to production (e.g. v0.2.2)
        required: true
      deploy:
        description: Bump pf_helm production to this image once it is pushed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One deploy per environment at a time; a second one waits rather than racing pf_helm.
  group: deploy-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'staging' || 'production' }}
  cancel-in-progress: false

env:
  IMAGE: gcr.io/packetfabric/public-mcp
  # A push to dev deploys staging; a release tag or a manual run deploys production.
  TARGET: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'staging' || 'production' }}
  IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'branch' && format('dev-{0}', github.run_number) || inputs.tag || github.ref_name }}
  VALUES_FILE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'envs/dev-central1-f/public-mcp/values.yaml' || 'envs/prod-central1-c/public-mcp/values.yaml' }}

jobs:
  build:
    runs-on: pf-arc-linux
    steps:
      - uses: actions/checkout@v6
        with:
          # Staging builds the pushed commit; production builds the release tag.
          ref: ${{ env.TARGET == 'staging' && github.sha || format('refs/tags/{0}', env.IMAGE_TAG) }}
          # Full history, so the production check below can see main.
          fetch-depth: 0

      - name: Check tag is on main
        if: env.TARGET == 'production'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$IMAGE_TAG is not on main; tag releases on main after the dev -> main PR"; exit 1; }

      - name: Check tag matches version
        if: env.TARGET == 'production'
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $IMAGE_TAG is not vX.Y.Z"; exit 1; }
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$IMAGE_TAG" || { echo "::error::tag $IMAGE_TAG != pyproject version $v"; exit 1; }

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          set -euo pipefail
          uv sync --group dev --locked
          uv run pytest -q

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$IMAGE_TAG already exists, not rebuilding"
            exit 0
          fi
          docker build --pull \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="$IMAGE_TAG" \
            -t "$IMAGE:$IMAGE_TAG" .
          docker push "$IMAGE:$IMAGE_TAG"

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: pf-arc-linux
    steps:
      - name: Checkout pf_helm
        uses: actions/checkout@v6
        with:
          repository: packetfabric/pf_helm
          token: ${{ secrets.PF_OTTO_GITHUB_PAT_TOKEN }}
          path: pf_helm

      - name: Bump image tag, commit and push
        working-directory: pf_helm
        run: |
          set -euo pipefail
          git config user.email "dev@packetfabric.com"
          git config user.name "GitHub Action Automation"
          # pf_helm main also takes other apps' automated bumps: on a rejected push,
          # start again from the new tip instead of rebasing.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [[ ! -f "$VALUES_FILE" ]]; then
              echo "::error::$VALUES_FILE is not on pf_helm main"
              exit 1
            fi
            sed -i "s@$IMAGE:[a-zA-Z0-9._-]*@$IMAGE:$IMAGE_TAG@g" "$VALUES_FILE"
            if git diff --quiet; then
              # Staging tags are unique per run, so no change there means the image
              # reference in the values file no longer matches. A release tag can be
              # redeployed, so in production it means the tag is already live.
              if [[ "$TARGET" == staging ]]; then
                echo "::error::no $IMAGE reference updated in $VALUES_FILE"
                exit 1
              fi
              echo "::notice::production already runs $IMAGE:$IMAGE_TAG"
              exit 0
            fi
            git diff --stat
            git commit -qam "public-mcp: deploy ${IMAGE_TAG} to ${TARGET} from GitHub Actions"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying"
          done
          exit 1

      - name: Notify
        if: always()
        uses: slackapi/slack-github-action@v3
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_CHANGELOG_PLATFORM }}
          webhook-type: incoming-webhook
          payload: |
            text: "public-mcp ${{ env.IMAGE_TAG }} -> ${{ env.TARGET }}: ${{ job.status }}"
