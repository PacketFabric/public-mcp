[project]
name = "packetfabric-mcp"
version = "0.2.0"
description = "MCP server for the PacketFabric NaaS API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]
authors = [{ name = "PacketFabric" }]
keywords = ["mcp", "a2a", "packetfabric", "naas", "networking", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
a2a = ["a2a-sdk[http-server]>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/PacketFabric/public-mcp"
Repository = "https://github.com/PacketFabric/public-mcp"
Documentation = "https://docs.packetfabric.com/api/v2/"

[project.scripts]
packetfabric-mcp = "packetfabric_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "jsonschema>=4", "a2a-sdk[http-server]>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packetfabric_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
