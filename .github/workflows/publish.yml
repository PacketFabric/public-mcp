# Release: bump the version in pyproject.toml, src/packetfabric_mcp/__init__.py and server.json
# (tests fail if they disagree), merge dev into main with a PR, then push a tag `vX.Y.Z` on main.
# A release tag that is not on main fails; pre-release tags such as `v0.3.0rc1` may come from dev.
# Pre-release tags publish to PyPI only (pip/uvx skip them unless asked); they are never listed
# on the MCP Registry, which would otherwise show the release candidate as the latest version.
# The same release tag makes image.yml publish ghcr.io/packetfabric/public-mcp:vX.Y.Z. The hosted
# server (https://mcp.packetfabric.com) moves to it only through a pf_helm PR that sets pod.image
# in envs/prod-central1-c/public-mcp/values.yaml to the line in that image.yml run's summary.
#
# One-time setup:
#  - PyPI: add a Trusted Publisher for project `packetfabric-mcp` -> this repo, workflow
#    `publish.yml`, environment `pypi`.
#  - MCP Registry: nothing; GitHub OIDC from the PacketFabric org proves the
#    io.github.PacketFabric/* namespace.
#  - The hosted endpoint (https://mcp.packetfabric.com/mcp) is listed in server.json itself.
#    The repo variable MCP_PUBLIC_URL, if set, overrides it at publish time.
name: Publish
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    outputs:
      release: ${{ steps.kind.outputs.release }}
    steps:
      - name: Release or pre-release?
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "Pre-release tag: PyPI only, no MCP Registry publish"
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so the release check can see main
      - name: Check release tag is on main
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "tag $GITHUB_REF_NAME is not on main; tag releases on main after the dev -> main PR"; exit 1; }
          fi
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: uv sync --group dev --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    if: needs.pypi.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Add hosted endpoint to server.json
        if: vars.MCP_PUBLIC_URL != ''
        env:
          URL: ${{ vars.MCP_PUBLIC_URL }}
        run: |
          jq --arg url "${URL%/}/mcp" '.remotes = [{
              type: "streamable-http", url: $url,
              headers: [{name: "Authorization", description: "Bearer <your PacketFabric API key>",
                         isRequired: true, isSecret: true}]
            }]' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retries while PyPI propagates the new release)
        run: |
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done; exit 1
