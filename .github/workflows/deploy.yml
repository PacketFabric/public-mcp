# Hosted deployment (https://mcp.packetfabric.com): container image + prod rollout.
#
# On a release tag vX.Y.Z (the same tag publish.yml ships to PyPI):
#  1. build the repo's Dockerfile and push gcr.io/packetfabric/public-mcp:<tag>
#  2. point pf_helm envs/prod-central1-c/public-mcp/values.yaml at that image;
#     Flux then rolls the Deployment in the prod cluster.
#
# Run it by hand (Actions > Deploy > Run workflow) to build a tag that predates this
# workflow or to redeploy one. Untick "deploy" to only build the image.
#
# Image tags are immutable: a tag that already exists in the registry is not rebuilt.
# Runs on pf-arc-linux, whose runners push to gcr.io through Workload Identity, so no
# registry key is stored here. The org secret PF_OTTO_GITHUB_PAT_TOKEN pushes to pf_helm.
name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and deploy (e.g. v0.2.2)
        required: true
      deploy:
        description: Point prod at the image once it is pushed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: gcr.io/packetfabric/public-mcp
  TAG: ${{ inputs.tag || github.ref_name }}
  VALUES_FILE: envs/prod-central1-c/public-mcp/values.yaml

jobs:
  image:
    runs-on: pf-arc-linux
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check tag matches version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$TAG" || { echo "::error::tag $TAG != pyproject version $v"; exit 1; }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --locked
      - run: uv run pytest -q
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker gcr.io --quiet
      - name: Build and push
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$TAG already exists, not rebuilding"
            exit 0
          fi
          docker build --pull \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="$TAG" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  deploy:
    needs: image
    if: github.event_name == 'push' || inputs.deploy
    runs-on: pf-arc-linux
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PacketFabric/pf_helm
          token: ${{ secrets.PF_OTTO_GITHUB_PAT_TOKEN }}
          path: pf_helm
      - name: Point prod at the new image
        working-directory: pf_helm
        run: |
          git config user.name "GitHub Action Automation"
          git config user.email "dev@packetfabric.com"
          # pf_helm main also takes other automated image bumps: on a rejected push,
          # start again from the new tip instead of rebasing.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            test -f "$VALUES_FILE" || { echo "::error::$VALUES_FILE is not on pf_helm main"; exit 1; }
            sed -i "s@$IMAGE:[A-Za-z0-9._-]*@$IMAGE:$TAG@" "$VALUES_FILE"
            if git diff --quiet; then
              echo "::notice::prod already runs $IMAGE:$TAG"
              exit 0
            fi
            git commit -qam "Deploy public-mcp $TAG to prod from GitHub Actions"
            git push -q origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt), retrying"
          done
          exit 1
