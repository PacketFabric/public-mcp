# Build and publish the container image to ghcr.io/packetfabric/public-mcp. No deploy step.
#
# Runs on GitHub-hosted runners with this repo's own GITHUB_TOKEN: no self-hosted runners,
# no cloud credentials, no deploy token.
#  - push to dev: v<pyproject version>-dev.<run_number>. The staging server
#    (https://mcp.dev.packetfabric.net) follows the newest one through Flux, so staging runs
#    what is on dev.
#  - release tag vX.Y.Z on main (the same tag publish.yml ships to PyPI): vX.Y.Z.
#    Production (https://mcp.packetfabric.com) follows the newest one the same way, so a
#    release tag is a production deploy. Release tags must be on main; pre-release tags
#    such as v0.3.0rc1 do not match the tag filter and build no image.
# Each run writes the tag@digest it published to its summary, for pinning or rolling back.
#
# A tag already in the registry is never rebuilt, so published tags stay immutable.
# Never rename this file: a new workflow file restarts run_number, new dev tags would sort
# below the old ones, and staging would stop moving.
name: image

on:
  push:
    branches: [dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  # One build per ref at a time; a second one waits rather than racing the same tag.
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/packetfabric/public-mcp
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so the release check below can see main.
          fetch-depth: 0

      - name: Pick tag
        id: tag
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::$GITHUB_REF_NAME is not on main; tag releases on main after the dev -> main PR"; exit 1; }
            [[ "v$v" == "$GITHUB_REF_NAME" ]] \
              || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$v-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          set -euo pipefail
          uv sync --group dev --locked
          uv run pytest -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$TAG already exists, not rebuilding"
          else
            # The source label links the GHCR package to this repo.
            docker build --pull \
              --label org.opencontainers.image.source=https://github.com/PacketFabric/public-mcp \
              --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
              --label org.opencontainers.image.version="$TAG" \
              -t "$IMAGE:$TAG" .
            docker push "$IMAGE:$TAG"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Published \`$IMAGE:$TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"
